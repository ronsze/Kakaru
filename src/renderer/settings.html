<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <title>캐릭터 설정</title>
    <style>
      :root {
        --frames: 8;
        --strip: 800px;
        --cycle: 560ms;
        --accent: #d9534f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 24px;
        font-family: -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
        font-size: 14px;
        color: #222;
        background: #fafafa;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 20px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      #notice {
        display: none;
        margin: 0 0 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: #fff4e5;
        border: 1px solid #f0c987;
      }
      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      section {
        background: #fff;
        border: 1px solid #e3e3e3;
        border-radius: 8px;
        padding: 14px;
        min-height: 400px;
      }
      #list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 420px;
        overflow-y: auto;
      }
      #list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 4px;
        border-bottom: 1px solid #f0f0f0;
      }
      #list li:last-child {
        border-bottom: none;
      }
      #list img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        background: #f3f3f3;
        border-radius: 6px;
      }
      .item-main {
        flex: 1;
        min-width: 0;
      }
      .item-name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item-meta {
        font-size: 12px;
        color: #777;
      }
      .item-problem {
        font-size: 12px;
        color: #b00020;
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 400;
        background: var(--accent);
        color: #fff;
      }
      .badge.default {
        background: #888;
      }
      .badge.active {
        background: #1b7f3b;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }
      input[type='text'],
      input[type='number'] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
      }
      input[type='file'] {
        width: 100%;
        font: inherit;
        font-size: 12px;
      }
      .error {
        min-height: 0;
        margin: 4px 0 0;
        font-size: 12px;
        color: #b00020;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #preview {
        display: flex;
        gap: 16px;
        margin-top: 12px;
      }
      .import-row {
        margin-top: 10px;
      }
      .import-details {
        margin: 6px 0 0;
        padding-left: 18px;
        font-size: 12px;
        color: #b00020;
      }
      .import-details:empty {
        display: none;
      }
      .preview-box {
        text-align: center;
        font-size: 12px;
        color: #777;
      }
      .stage {
        width: 100px;
        height: 100px;
        margin-bottom: 4px;
        overflow: hidden;
        position: relative;
        background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
        border-radius: 6px;
      }
      .stage img {
        position: absolute;
        top: 0;
        left: 0;
        height: 100px;
      }
      #preview-walk {
        width: var(--strip);
        animation: walk var(--cycle) steps(var(--frames)) infinite;
      }
      #preview-idle {
        width: 100px;
      }
      @keyframes walk {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(-1 * var(--strip)));
        }
      }
      /* 대사 편집 패널 */
      #lines-panel textarea {
        width: 100%;
        min-height: 92px;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        line-height: 1.45;
        resize: vertical;
      }
      #lines-panel textarea.invalid {
        border-color: #b00020;
      }
      .lines-cat {
        margin-bottom: 10px;
      }
      .cat-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .cat-head label {
        margin: 0 0 4px;
      }
      .cat-count {
        font-size: 12px;
        color: #777;
      }
      .cat-count.over {
        color: #b00020;
        font-weight: 600;
      }
      .cat-errors {
        margin: 4px 0 0;
        padding-left: 18px;
        font-size: 12px;
        color: #b00020;
      }
      .cat-errors:empty {
        display: none;
      }
      .lines-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .unsaved-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #fff4e5;
        border: 1px solid #f0c987;
        font-size: 13px;
      }
      .unsaved-bar span {
        flex: 1;
      }
      .gone {
        margin: 0 0 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #fdecea;
        border: 1px solid #f5b5ae;
        color: #b00020;
        font-size: 13px;
      }
      #status {
        margin-top: 8px;
        font-size: 13px;
      }
      #status.ok,
      #lines-status.ok {
        color: #1b7f3b;
      }
      #status.fail,
      #lines-status.fail {
        color: #b00020;
      }
      #lines-status {
        margin-top: 8px;
        font-size: 13px;
      }
      [hidden] {
        display: none !important;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 12px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <h1>캐릭터 설정</h1>
    <div id="notice" role="alert"></div>
    <div class="columns">
      <section>
        <h2>등록된 캐릭터</h2>
        <ul id="list"></ul>
        <div class="import-row"><button id="import" type="button">파일에서 가져오기</button></div>
        <ul id="import-details" class="import-details" role="alert"></ul>
      </section>
      <section id="register-section">
        <h2>새 캐릭터 등록</h2>
        <label for="name">이름</label>
        <input id="name" type="text" maxlength="60" autocomplete="off" />
        <div class="error" id="error-name"></div>

        <label for="frames">걷기 프레임 수</label>
        <input id="frames" type="number" value="8" min="2" max="32" step="1" />
        <div class="error" id="error-frames"></div>

        <label for="walk">걷기 이미지 (프레임을 가로로 이은 PNG)</label>
        <input id="walk" type="file" accept="image/png" />
        <div class="error" id="error-walk"></div>

        <label for="idle">정지 이미지 (PNG)</label>
        <input id="idle" type="file" accept="image/png" />
        <div class="error" id="error-idle"></div>

        <div id="preview">
          <div class="preview-box">
            <div class="stage"><img id="preview-walk" alt="" hidden /></div>
            걷기
          </div>
          <div class="preview-box">
            <div class="stage"><img id="preview-idle" alt="" hidden /></div>
            정지
          </div>
        </div>
        <p class="hint" id="hint">걷기 이미지와 정지 이미지를 모두 선택하면 미리보기와 검사 결과가 나타납니다.</p>
        <button id="register" class="primary" type="button" disabled>등록</button>
        <div id="status" role="status"></div>
      </section>
      <section id="lines-panel" hidden>
        <h2 id="lines-title">대사 편집</h2>
        <div id="lines-unsaved" class="unsaved-bar" role="alert" hidden>
          <span>저장하지 않은 변경이 있습니다.</span>
          <button id="unsaved-save" class="primary" type="button">저장</button>
          <button id="unsaved-discard" type="button">버리기</button>
          <button id="unsaved-keep" type="button">계속 편집</button>
        </div>
        <div id="lines-gone" class="gone" role="alert" hidden>삭제된 캐릭터입니다. 더 이상 저장할 수 없습니다.</div>
        <div class="lines-cat">
          <div class="cat-head"><label for="lines-greeting">인사 (실행할 때)</label><span class="cat-count" id="count-greeting"></span></div>
          <textarea id="lines-greeting" spellcheck="false"></textarea>
          <ul class="cat-errors" id="errors-greeting"></ul>
        </div>
        <div class="lines-cat">
          <div class="cat-head"><label for="lines-normal">평소</label><span class="cat-count" id="count-normal"></span></div>
          <textarea id="lines-normal" spellcheck="false"></textarea>
          <ul class="cat-errors" id="errors-normal"></ul>
        </div>
        <div class="lines-cat">
          <div class="cat-head"><label for="lines-grabbed">잡혔을 때</label><span class="cat-count" id="count-grabbed"></span></div>
          <textarea id="lines-grabbed" spellcheck="false"></textarea>
          <ul class="cat-errors" id="errors-grabbed"></ul>
        </div>
        <div class="lines-cat">
          <div class="cat-head"><label for="lines-struggling">오래 잡혔을 때</label><span class="cat-count" id="count-struggling"></span></div>
          <textarea id="lines-struggling" spellcheck="false"></textarea>
          <ul class="cat-errors" id="errors-struggling"></ul>
        </div>
        <p class="hint">한 줄에 한 문장씩 적습니다. 문장은 1~60자, 분류당 최대 50개이며 빈 줄과 같은 분류의 중복 문장은 저장할 때 정리됩니다.</p>
        <div class="lines-actions">
          <button id="lines-save" class="primary" type="button" disabled>저장</button>
          <button id="lines-restore" type="button"></button>
          <button id="lines-close" type="button">닫기</button>
        </div>
        <div id="lines-status" role="status"></div>
      </section>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
