<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Kakaru</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* 걷기 이미지의 프레임 수에 따라 draw.ts가 값을 바꾼다 (기본 캐릭터: 8프레임) */
      :root {
        --frames: 8;
        --strip: 800px;
        --cycle: 560ms;
        --scale: 1;
      }
      /* 캐릭터 요소만 transform으로 옮긴다. 위치 이동과 걷기 프레임 전환 모두 CSS가 처리해
         프레임마다 JS를 돌리지 않는다. */
      #actor {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100px;
        height: 100px;
        will-change: transform;
      }
      #sprite {
        position: relative;
        width: 100px;
        height: 100px;
        overflow: hidden;
      }
      /* 확대·축소: 캐릭터 중심을 기준으로 배율을 적용한다. 왼쪽을 볼 때는 좌우도 반전한다. */
      #sprite {
        transform: scale(var(--scale));
      }
      #sprite.facing-left {
        transform: scale(calc(-1 * var(--scale)), var(--scale));
      }
      /* <img>는 기본적으로 끌 수 있어, 누른 채 움직이면 브라우저 드래그가 시작되며 포인터 이벤트가 취소된다 */
      /* 말풍선: #actor 안에 있어 캐릭터가 걷는 동안 CSS로 함께 움직인다. 스프라이트 위쪽(배율 반영)에 붙는다.
         --shift는 화면 가장자리에서 잘리지 않게 draw.ts가 정하는 가로 보정값이다. */
      #bubble {
        --gap: 8px;
        --shift: 0px;
        display: none;
        position: absolute;
        left: 50%;
        top: 0;
        width: max-content;
        max-width: 200px;
        box-sizing: border-box;
        padding: 6px 10px;
        background: #fff;
        color: #222;
        border: 2px solid #222;
        border-radius: 12px;
        font: 13px/1.4 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
        pointer-events: none;
        transform: translate(calc(-50% + var(--shift)), calc(-100% + 50px - 50px * var(--scale) - var(--gap)));
      }
      #bubble.below {
        transform: translate(calc(-50% + var(--shift)), calc(50px + 50px * var(--scale) + var(--gap)));
      }
      /* 꼬리: 말풍선이 옆으로 밀려도 캐릭터 쪽을 가리킨다 */
      #bubble::after {
        content: '';
        position: absolute;
        left: calc(50% - var(--shift));
        bottom: -8px;
        width: 10px;
        height: 10px;
        background: #fff;
        border-right: 2px solid #222;
        border-bottom: 2px solid #222;
        transform: translateX(-50%) rotate(45deg);
      }
      #bubble.below::after {
        bottom: auto;
        top: -8px;
        transform: translateX(-50%) rotate(225deg);
      }
      /* 오래 잡혀 있으면 발버둥: 좌우를 번갈아 보며 살짝 흔들린다 (transform 애니메이션이라 compositor가 처리) */
      #actor.struggling #sprite {
        animation: struggle 0.5s steps(1, end) infinite;
      }
      /* 발버둥은 정지 이미지가 아니라 걷기 이미지를 쓴다 */
      #actor.struggling #sprite #walk {
        display: block;
      }
      #actor.struggling #sprite #idle {
        display: none;
      }
      @keyframes struggle {
        0% {
          transform: scale(var(--scale)) rotate(-6deg);
        }
        50% {
          transform: scale(calc(-1 * var(--scale)), var(--scale)) rotate(6deg);
        }
      }
      #sprite img {
        -webkit-user-drag: none;
        user-select: none;
        position: absolute;
        top: 0;
        left: 0;
        height: 100px;
      }
      /* 걷기: 같은 크기의 프레임을 가로로 이은 시트(표시 크기 100px 기준 프레임 수 × 100px)를
         transform으로 steps 이동한다. transform 애니메이션은 compositor가 처리해 다시 그리지 않는다. */
      #walk {
        width: var(--strip);
        display: none;
        animation: walk var(--cycle) steps(var(--frames)) infinite;
      }
      #idle {
        width: 100px;
        display: none;
      }
      #sprite.walking #walk,
      #sprite.idle #idle {
        display: block;
      }
      @keyframes walk {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(-1 * var(--strip)));
        }
      }
    </style>
  </head>
  <body>
    <div id="actor">
      <div id="sprite" class="idle"><img id="walk" alt="" /><img id="idle" alt="" /></div>
      <div id="bubble"></div>
    </div>
    <script type="module" src="./draw.ts"></script>
  </body>
</html>
